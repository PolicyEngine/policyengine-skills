name: Analyze policy

# Triggered by the CRM Research agent (workflow_dispatch) once a human approves a
# discovered reform. Runs the /analyze-policy command headless with Claude Code;
# the command's report-logger stage opens the resulting issue / draft PR.
on:
  workflow_dispatch:
    inputs:
      reform:
        description: 'Reform to analyze — a bill id (e.g. "US HR9296"), preset (e.g. "preset:arpa-ctc-restoration"), or natural-language reform'
        required: true
        type: string
      country:
        description: 'us | uk | ca'
        required: false
        default: 'us'
        type: choice
        options: [us, uk, ca]
      year:
        description: 'Tax/benefit year (only used with horizon=1)'
        required: false
        default: '2026'
        type: string
      horizon:
        description: 'Time horizon: 1 (single-year, ~7 min) or 10 (full 10-year via /budget-window, ~15-25 min)'
        required: false
        default: '1'
        type: choice
        options: ['1', '10']
      log_to:
        description: 'Override destination routing. Blank = auto-routing by verdict (INVESTIGATE → policyengine-{country}-data, structural → policyengine-{country}). Example: "archive,issue:policyengine-us-data"'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run the pipeline through Stage 7 (write-up) but skip Phase 8 destination writes. Useful for previewing what would be filed.'
        required: false
        default: false
        type: boolean

jobs:
  # Fast regression check before spending time on the full pipeline. Catches
  # scorekeepers registry breakage, frontmatter drift, dataset-name typos.
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run pipeline regression tests
        run: uv run pytest tests/pipeline/ -v

  analyze:
    needs: regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 75  # horizon 10 (~15-25 min) AND non-2026 years: the API caches the current-year baseline only, so e.g. TY2027 runs baseline + reform economy computes fresh (a TY2027 run timed out at 45)
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install the policyengine-claude plugin
        # The marketplace is the synced wrapper repo (sync-claude.yml publishes
        # this repo's targets/claude there). /analyze-policy ships in its
        # analysis-tools plugin. No `|| true`: if the install fails, the run
        # must fail here, not silently no-op at the claude step.
        run: |
          claude plugin marketplace add PolicyEngine/policyengine-claude
          claude plugin install analysis-tools@policyengine-claude

      - name: Run /analyze-policy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PAT with `repo` scope so report-logger can open issues/PRs in the
          # target repos (policyengine-{country}-data, policyengine-{country},
          # policyengine-app for blog draft PRs, etc.).
          GH_TOKEN: ${{ secrets.ANALYSIS_GH_TOKEN }}
          # Inputs come in via env (NOT inline ${{ }} interpolation into the
          # shell line) so quotes in the reform text can't split the command.
          REFORM: ${{ inputs.reform }}
          COUNTRY: ${{ inputs.country }}
          YEAR: ${{ inputs.year }}
          HORIZON: ${{ inputs.horizon }}
          LOG_TO: ${{ inputs.log_to }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          PROMPT="/analysis-tools:analyze-policy \"$REFORM\" --country $COUNTRY --horizon $HORIZON --auto-confirm"
          if [ "$HORIZON" = "1" ]; then
            PROMPT="$PROMPT --year $YEAR"
          fi
          if [ -n "$LOG_TO" ]; then
            PROMPT="$PROMPT --log-to \"$LOG_TO\""
          fi
          if [ "$DRY_RUN" = "true" ]; then
            PROMPT="$PROMPT --no-log"
          fi
          echo "Prompt: $PROMPT"
          claude -p "$PROMPT" \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Write,Edit,WebFetch,WebSearch" \
            2>&1 | tee /tmp/claude-output.log

      - name: Verify a report was produced
        # `claude -p` exits 0 even when the slash command doesn't resolve or
        # the pipeline bails early. The contract: a real run always writes
        # ONE of the Phase 2/7 outputs — the full report, a structural
        # backlog, or a not-modelable rationale. Structural/not-possible are
        # correct terminal outcomes (Phase 2 EXITs before the microsim),
        # not failures (e.g. HI SB3125: model lacks a 13th-bracket slot).
        run: |
          if ! ls /tmp/analyze-policy-*.md /tmp/*-structural-backlog.md /tmp/*-not-modelable.md >/dev/null 2>&1; then
            echo "::error::No analyze-policy output found (report, structural backlog, or not-modelable rationale) — the command did not actually run. See claude-output.log in the artifact."
            exit 1
          fi

      - name: Upload archived analysis
        # Always upload the archive even if downstream destination writes failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-archive
          path: |
            analyses/*.md
            /tmp/analyze-policy-*.md
            /tmp/*-structural-backlog.md
            /tmp/*-not-modelable.md
            /tmp/claude-output.log
          if-no-files-found: warn
          retention-days: 30
