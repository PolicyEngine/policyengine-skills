    tier: 3
    jurisdictions: [us]
    domains: [tax, spending, healthcare, benefits]
    url: https://www.aei.org/
    search_hints: ["site:aei.org"]

  - name: Brookings
    full_name: Brookings Institution
    tier: 3
    jurisdictions: [us]
    domains: [tax, distributional, benefits, healthcare]
    url: https://www.brookings.edu/
    search_hints: ["site:brookings.edu"]

  - name: BPC
    full_name: Bipartisan Policy Center
    tier: 3
    jurisdictions: [us]
    domains: [tax, healthcare, retirement, immigration]
    url: https://bipartisanpolicy.org/
    search_hints: ["site:bipartisanpolicy.org"]

  - name: EPI
    full_name: Economic Policy Institute
