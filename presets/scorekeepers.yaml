# Scorekeepers registry — official fiscal offices (Tier 2) and think-tanks (Tier 3)
# consulted by prior-scores-finder for external-benchmark evidence.
#
# The pipeline requires at least 2 external sources within ±25% for a PASS verdict.
# This registry ensures those searches cast a wide-enough net without hardcoding
# a US-only, tax-only bias into the agents.
#
# Add a scorekeeper by appending a block below with the fields shown. Prior-scores-finder
# will start consulting it on the next run. No code change required.
#
# Fields:
#   name         (required) — canonical short name used in benchmark_sources[].source
#   full_name    (required) — full institutional name
#   tier         (required) — 2 (official fiscal office) or 3 (think-tank / advocacy)
#   jurisdictions (required) — list of country codes this scorekeeper covers (us, uk, ca, or ["global"])
#   domains      (required) — list of policy areas they score (tax, benefits, budget, healthcare, etc.)
#   url          (required) — homepage
#   search_hints (optional) — extra query hints for WebSearch (e.g., "site:crfb.org")
#   caveats      (optional) — known biases, publication cadence, dataset differences
#
# Tier 2 vs Tier 3 rule: Tier 2 sources have official standing (produce estimates
# used in legislation or budget documents). Tier 3 sources are independent analysts
# whose estimates are widely cited but not officially binding. When in doubt, use Tier 3.

scorekeepers:
  # ============================================================================
  # UNITED STATES
  # ============================================================================

  # Tier 2 — Official fiscal offices (US)
  - name: JCT
    full_name: Joint Committee on Taxation
    tier: 2
    jurisdictions: [us]
    domains: [tax, revenue]
    url: https://www.jct.gov/
    search_hints: ["site:jct.gov", "JCT JCX", "Joint Committee on Taxation"]
    caveats: "Official tax-legislation scores. Publishes JCX-N-YY documents. Static microsim; no behavioral response for revenue scoring."

  - name: CBO
    full_name: Congressional Budget Office
    tier: 2
    jurisdictions: [us]
    domains: [tax, spending, budget, healthcare, benefits]
    url: https://www.cbo.gov/
    search_hints: ["site:cbo.gov", "Congressional Budget Office"]
    caveats: "Official spending + revenue scores. Publishes Budget Options and cost estimates. 10-year windows."

  - name: OTA
    full_name: Office of Tax Analysis (Treasury)
    tier: 2
    jurisdictions: [us]
    domains: [tax, revenue]
    url: https://home.treasury.gov/policy-issues/tax-policy/office-of-tax-analysis
    search_hints: ["site:treasury.gov", "Office of Tax Analysis"]

  - name: SSA-OCACT
    full_name: Social Security Administration Office of the Chief Actuary
    tier: 2
    jurisdictions: [us]
    domains: [social-security, disability, oasi]
    url: https://www.ssa.gov/OACT/
    search_hints: ["site:ssa.gov/OACT"]

  # Tier 3 — Think-tanks (US)
  - name: CRFB
    full_name: Committee for a Responsible Federal Budget
    tier: 3
    jurisdictions: [us]
    domains: [budget, deficit, tax, spending]
    url: https://www.crfb.org/
    search_hints: ["site:crfb.org"]

  - name: TPC
    full_name: Tax Policy Center
    tier: 3
    jurisdictions: [us]
    domains: [tax, distributional]
    url: https://taxpolicycenter.org/
    search_hints: ["site:taxpolicycenter.org", "Tax Policy Center"]
    caveats: "Joint Urban Institute + Brookings project. Deep distributional microsim; some scores behind paywall or only in blog form."

  - name: Tax Foundation
    full_name: Tax Foundation
    tier: 3
    jurisdictions: [us]
    domains: [tax, economic-growth]
    url: https://taxfoundation.org/
    search_hints: ["site:taxfoundation.org"]
    caveats: "Uses General Equilibrium Model for dynamic scoring; conventional revenue often reported alongside."

  - name: CBPP
    full_name: Center on Budget and Policy Priorities
    tier: 3
    jurisdictions: [us]
    domains: [benefits, low-income, snap, medicaid, ctc, eitc, housing]
    url: https://www.cbpp.org/
    search_hints: ["site:cbpp.org"]

  - name: ITEP
    full_name: Institute on Taxation and Economic Policy
    tier: 3
    jurisdictions: [us]
    domains: [tax, distributional, state-tax]
    url: https://itep.org/
    search_hints: ["site:itep.org"]
    caveats: "Distributional focus with 6-tier income breakdown; state-level tax analysis is a strength."

  - name: Penn Wharton Budget Model
    full_name: Penn Wharton Budget Model
    tier: 3
    jurisdictions: [us]
    domains: [tax, budget, macroeconomic]
    url: https://budgetmodel.wharton.upenn.edu/
    search_hints: ["site:budgetmodel.wharton.upenn.edu", "Penn Wharton Budget Model"]
    caveats: "Publishes both conventional and dynamic (macro-response) scores."

  - name: Yale Budget Lab
    full_name: Budget Lab at Yale
    tier: 3
    jurisdictions: [us]
    domains: [tax, spending, budget]
    url: https://budgetlab.yale.edu/
    search_hints: ["site:budgetlab.yale.edu", "Yale Budget Lab"]

  - name: Peterson Foundation
    full_name: Peter G. Peterson Foundation
    tier: 3
    jurisdictions: [us]
